<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Access Answers</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4f4f4;
font-family:Arial,sans-serif;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

#title{
text-align:center;
font-size:32px;
color:#008751;
margin-bottom:20px;
font-weight:bold;
}

#image{
width:100%;
border-radius:10px;
margin-bottom:20px;
display:none;
}

#content{
white-space:pre-wrap;
line-height:1.9;
font-size:18px;
color:#222;
}

.loading{
text-align:center;
padding:30px;
}

</style></head><body><div class="container"><div class="card"><h1 id="title">Loading...</h1><img id="image"><div id="content" class="loading">
Loading answers...
</div></div></div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAzSw3J9ijVn-1xwGkKh8ZXe77i44QsVmE",
authDomain: "mikeanswers-1ba00.firebaseapp.com",
projectId: "mikeanswers-1ba00"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);

const subject = urlParams.get("subject");
const pin = urlParams.get("pin");

const title = document.getElementById("title");
const content = document.getElementById("content");
const image = document.getElementById("image");

title.innerText = subject || "Answers";

const docRef = doc(db,"answers",subject);
const docSnap = await getDoc(docRef);

if(docSnap.exists()){

const data = docSnap.data();

if(data.pin === pin){

content.innerText = data.content || "No answers uploaded yet.";

if(data.image){

image.src = data.image;

image.onload = () => {
image.style.display = "block";
};

}

}else{

title.innerText = "Access Denied";
content.innerText = "Wrong PIN";

}

}else{

title.innerText = "Not Found";
content.innerText = "Subject not found";

}

</script></body>
</html>
